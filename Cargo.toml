[package]
name = "qwen3-tts"
version = "0.3.0"
edition = "2021"
description = "Pure Rust inference for Qwen3-TTS"
license = "MIT"
autobenches = false

[features]
default = ["cpu"]
cpu = ["burn/ndarray"]
cli = ["clap", "indicatif"]
serve = ["cli", "dep:axum", "dep:tokio", "dep:tokio-stream", "dep:tower-http"]
hub = ["hf-hub"]
_candle_legacy = []  # Gates old candle-based code during Burn migration

# All platform-portable features. Use `cargo lint` / `cargo check-all` / `cargo test-all`
# instead of --all-features (which fails because platform-specific features conflict).
all-portable = ["cpu", "cli", "hub"]

# Platform-specific — enable manually based on your hardware:
#   macOS:         wgpu (Vulkan/Metal via CubeCL)
#   Linux + Intel: cpu (with openblas if desired)
#   Linux + NVIDIA: cuda
#   Linux + AMD:   rocm
cuda = ["burn/cuda"]
rocm = ["burn/rocm"]
wgpu = ["burn/wgpu"]
vulkan = ["wgpu", "burn/vulkan"]
profiling = ["dep:tracing-chrome"]

[dependencies]
# Burn ML framework (replaces Candle)
burn = { path = "/home/harald/git/burn/crates/burn", default-features = false }
half = "2.7"
safetensors = "0.4"

# Tokenization (HuggingFace tokenizers in Rust)
tokenizers = "0.22"

# Audio processing
hound = "3.5"              # WAV I/O
rubato = "1.0"            # High-quality resampling
rustfft = "6.2"            # FFT for spectrograms

# Serialization & model loading
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rayon = "1.10"             # Parallel CPU processing
byteorder = "1.5"
num-traits = "0.2"
num-complex = "0.4"

# CLI (optional)
clap = { version = "4.5", features = ["derive"], optional = true }
indicatif = { version = "0.18", optional = true }

# HuggingFace Hub (optional) - uses ureq sync client, no OpenSSL needed
hf-hub = { version = "0.4", default-features = false, features = ["ureq"], optional = true }
audioadapter-buffers = "2.0.0"

# Profiling (optional)
tracing-chrome = { version = "0.7", optional = true }

# HTTP server (optional, for serve feature)
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
criterion = "0.8"
approx = "0.5"
tempfile = "3.15"
ndarray = "0.17.2"
ndarray-npy = "0.10.0"

[[bin]]
name = "generate_audio"
path = "src/bin/generate_audio.rs"
required-features = ["cli"]

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "audio"
harness = false

[[bench]]
name = "tensor_ops"
harness = false

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["serve"]

[[bin]]
name = "e2e_bench"
path = "benches/e2e_bench.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
lto = false

# Override cubecl crates to use local builds (must match burn's local cubecl)
[patch.crates-io]
cubecl = { path = "/home/harald/git/cubecl/crates/cubecl" }
cubecl-common = { path = "/home/harald/git/cubecl/crates/cubecl-common" }
cubecl-core = { path = "/home/harald/git/cubecl/crates/cubecl-core" }
cubecl-cpp = { path = "/home/harald/git/cubecl/crates/cubecl-cpp" }
cubecl-cpu = { path = "/home/harald/git/cubecl/crates/cubecl-cpu" }
cubecl-cuda = { path = "/home/harald/git/cubecl/crates/cubecl-cuda" }
cubecl-hip = { path = "/home/harald/git/cubecl/crates/cubecl-hip" }
cubecl-ir = { path = "/home/harald/git/cubecl/crates/cubecl-ir" }
cubecl-macros = { path = "/home/harald/git/cubecl/crates/cubecl-macros" }
cubecl-macros-internal = { path = "/home/harald/git/cubecl/crates/cubecl-macros-internal" }
cubecl-opt = { path = "/home/harald/git/cubecl/crates/cubecl-opt" }
cubecl-runtime = { path = "/home/harald/git/cubecl/crates/cubecl-runtime" }
cubecl-spirv = { path = "/home/harald/git/cubecl/crates/cubecl-spirv" }
cubecl-std = { path = "/home/harald/git/cubecl/crates/cubecl-std" }
cubecl-wgpu = { path = "/home/harald/git/cubecl/crates/cubecl-wgpu" }
cubecl-zspace = { path = "/home/harald/git/cubecl/crates/cubecl-zspace" }
cubecl-hip-sys = { path = "/home/harald/git/cubecl-hip-sys/crates/cubecl-hip-sys" }
